name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Unit & Algorithmic Verification
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Check out code
      uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt pytest pytest-asyncio httpx aiosqlite flake8

    - name: Code Quality & Linting
      run: |
        flake8 app/ --count --select=E9,F63,F7,F82 --show-source --statistics

    - name: Run Test Suite
      run: |
        PYTHONPATH=. python3 -m unittest discover -s tests -p "test_base62.py" -v
        PYTHONPATH=. pytest tests/test_bloom.py tests/test_api.py -v
